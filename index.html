<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Deutsch">
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>🇩🇪 Deutsch für Rumänen</title>
<style>
:root {
  --p:#4F46E5;--pd:#3730A3;--s:#7C3AED;
  --ok:#10B981;--err:#EF4444;--warn:#F59E0B;
  --bg:#EEF0FF;--card:#fff;--txt:#1F2937;--txt2:#6B7280;
  --bdr:#E5E7EB;--r:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100vh;overflow-x:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);}
.screen{display:none;animation:fadeIn .25s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes cardIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
@keyframes cardBack{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:translateX(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes pop{0%{transform:scale(.8);opacity:0}80%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateX(-50%) translateY(100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.mw{max-width:480px;margin:0 auto;}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--p) 0%,var(--s) 100%);color:#fff;padding:22px 16px 28px;text-align:center;position:relative;overflow:hidden;}
.hdr::after{content:'';position:absolute;bottom:-20px;left:-10%;width:120%;height:40px;background:var(--bg);border-radius:50% 50% 0 0;}
.hdr h1{font-size:26px;font-weight:900;letter-spacing:-.5px;}
.hdr p{font-size:13px;opacity:.85;margin:4px 0 14px;}
.stats-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.pill{background:rgba(255,255,255,.22);backdrop-filter:blur(8px);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:5px;}

/* STREAK BAR */
.streak-box{background:linear-gradient(135deg,#F97316,#EF4444);color:#fff;margin:18px 16px 6px;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(239,68,68,.25);}
.streak-fire{font-size:30px;flex-shrink:0;}
.streak-num{font-size:21px;font-weight:900;line-height:1;}
.streak-sub{font-size:12px;opacity:.88;}
.motivate{font-size:13px;font-style:italic;color:var(--txt2);text-align:center;padding:6px 16px 0;}

/* PROGRESS */
.prog-box{background:var(--card);margin:14px 16px 6px;border-radius:var(--r);padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.prog-lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--txt2);margin-bottom:8px;}
.prog-bar{background:#E5E7EB;border-radius:99px;height:10px;overflow:hidden;}
.prog-fill{background:linear-gradient(90deg,var(--p),var(--s));height:100%;border-radius:99px;transition:width .6s ease;}

/* LESSON LIST */
.lessons-wrap{padding:10px 16px 32px;}
.sec-title{font-size:14px;font-weight:800;color:var(--txt2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;}
.lcard{background:var(--card);border-radius:var(--r);padding:13px 13px 13px 15px;margin-bottom:9px;box-shadow:0 2px 8px rgba(0,0,0,.06);display:flex;align-items:center;gap:11px;cursor:pointer;transition:transform .12s,box-shadow .12s;border:2.5px solid transparent;position:relative;overflow:hidden;}
.lcard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:2px 0 0 2px;}
.lcard:active{transform:scale(.975);box-shadow:0 1px 4px rgba(0,0,0,.08);}
.lcard.done{border-color:var(--ok);}
.lcard.done::before{background:var(--ok);}
.lcard.cur{border-color:var(--p);}
.lcard.cur::before{background:var(--p);}
.lcard.locked{opacity:.42;cursor:not-allowed;}
.lcard.math-card::before{background:#3B82F6;}
.lcard.fs-card::before{background:#D97706;}
.l-ico{font-size:33px;width:50px;height:50px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.l-info{flex:1;min-width:0;}
.l-title{font-size:15px;font-weight:700;}
.l-sub{font-size:12px;color:var(--txt2);margin-top:2px;}
.l-meta{display:flex;align-items:center;gap:5px;margin-top:5px;flex-wrap:wrap;}
.badge{background:var(--bg);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:600;color:var(--txt2);}
.badge.a1{background:#D1FAE5;color:#065F46;}
.badge.a2{background:#DBEAFE;color:#1E40AF;}
.badge.math{background:#EDE9FE;color:#5B21B6;}
.badge.b1{background:#FEF3C7;color:#92400E;}
.stars{font-size:13px;letter-spacing:1px;}
.l-status{font-size:21px;flex-shrink:0;}

/* VOCAB HEADER */
.v-hdr{color:#fff;padding:13px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
.back-btn{background:rgba(255,255,255,.22);border:none;color:#fff;width:37px;height:37px;border-radius:10px;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s;}
.back-btn:active{background:rgba(255,255,255,.4);}
.v-hdr-info{flex:1;}
.v-hdr-title{font-size:16px;font-weight:800;}
.v-hdr-sub{font-size:11px;opacity:.8;margin-top:2px;}
.cnt-pill{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:700;}

/* VOCAB CARD */
.vc-wrap{padding:16px 16px 24px;}
.vc-prog{background:#E5E7EB;border-radius:99px;height:6px;margin-bottom:18px;overflow:hidden;}
.vc-prog-fill{background:linear-gradient(90deg,var(--p),var(--s));height:100%;transition:width .3s ease;}
.vc-card{background:var(--card);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 8px 28px rgba(0,0,0,.13);display:flex;flex-direction:column;align-items:center;gap:10px;}
.vc-card.anim-fwd{animation:cardIn .28s ease;}
.vc-card.anim-bwd{animation:cardBack .28s ease;}
.vc-emoji{font-size:70px;line-height:1;animation:pop .4s ease;}
.vc-de{font-size:32px;font-weight:900;color:var(--p);letter-spacing:-.5px;line-height:1.1;}
.vc-ro{font-size:19px;color:var(--txt);font-weight:600;}
.speak-btn{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border:none;border-radius:11px;padding:9px 20px;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;transition:opacity .15s,transform .12s;margin-top:2px;}
.speak-btn:active{opacity:.8;transform:scale(.96);}

/* TIP & EXAMPLE */
.tip-box{background:#FEF3C7;border-left:3px solid #F59E0B;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#92400E;margin-top:6px;width:100%;text-align:left;line-height:1.4;}
.eg-box{background:#EFF6FF;border-left:3px solid #3B82F6;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#1E40AF;margin-top:5px;width:100%;text-align:left;line-height:1.5;}
.eg-de{font-weight:700;display:block;}
.eg-ro{opacity:.8;font-style:italic;display:block;margin-top:2px;}

/* CONFIDENCE */
.conf-label{font-size:11.5px;font-weight:700;color:var(--txt2);margin-top:12px;text-align:center;text-transform:uppercase;letter-spacing:.4px;}
.conf-row{display:flex;gap:7px;margin-top:5px;width:100%;}
.conf-btn{flex:1;border:2px solid var(--bdr);background:var(--card);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;text-align:center;line-height:1.3;}
.conf-btn:active{transform:scale(.95);}
.conf-btn.active-red{background:#FEE2E2;border-color:var(--err);color:#991B1B;}
.conf-btn.active-yel{background:#FEF3C7;border-color:#D97706;color:#92400E;}
.conf-btn.active-grn{background:#D1FAE5;border-color:var(--ok);color:#065F46;}

/* NAV BUTTONS */
.vc-nav{display:flex;gap:10px;margin-top:16px;}
.nav-btn{background:var(--card);border:2px solid var(--bdr);color:var(--txt);border-radius:13px;padding:13px 0;font-size:15px;font-weight:700;cursor:pointer;flex:1;text-align:center;transition:all .12s;display:flex;align-items:center;justify-content:center;gap:5px;}
.nav-btn.pri{background:linear-gradient(135deg,var(--p),var(--s));border-color:transparent;color:#fff;}
.nav-btn:disabled{opacity:.35;cursor:not-allowed;}
.nav-btn:not(:disabled):active{transform:scale(.97);}
.quiz-go-btn{background:linear-gradient(135deg,var(--ok),#059669);color:#fff;border:none;border-radius:15px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;width:100%;margin-top:13px;transition:opacity .15s,transform .12s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 15px rgba(16,185,129,.35);}
.quiz-go-btn:active{opacity:.85;transform:scale(.98);}

/* QUIZ HEADER */
.q-hdr{background:linear-gradient(135deg,#F59E0B,#EF4444);color:#fff;padding:13px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;}
.q-prog-bar{flex:1;background:rgba(255,255,255,.3);border-radius:99px;height:8px;overflow:hidden;}
.q-prog-fill{background:#fff;height:100%;transition:width .3s ease;border-radius:99px;}
.q-hdr.math-hdr{background:linear-gradient(135deg,#3B82F6,#8B5CF6);}
.q-hdr.fs-hdr{background:linear-gradient(135deg,#D97706,#DC2626);}

/* QUIZ CONTENT */
.q-wrap{padding:16px 16px 28px;}
.q-card{background:var(--card);border-radius:20px;padding:20px 16px;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.09);margin-bottom:16px;}
.q-num{font-size:11px;font-weight:700;color:var(--txt2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;}
.q-emoji{font-size:50px;margin-bottom:4px;}
.q-text{font-size:22px;font-weight:900;color:var(--p);line-height:1.2;}
.q-text.math-q{font-size:20px;color:#1E40AF;white-space:pre-line;}
.q-hint{font-size:12px;color:var(--txt2);margin-top:5px;font-style:italic;}
.math-hint{background:#F3F4F6;border-radius:8px;padding:6px 12px;font-size:14px;color:var(--txt2);font-family:monospace;margin-top:8px;font-weight:700;}
.q-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.q-opt{background:var(--card);border:2.5px solid var(--bdr);border-radius:13px;padding:15px 10px;font-size:14px;font-weight:600;cursor:pointer;text-align:center;transition:all .12s;color:var(--txt);min-height:60px;display:flex;align-items:center;justify-content:center;word-break:break-word;hyphens:auto;line-height:1.3;}
.q-opt:active:not(.dis){transform:scale(.97);}
.q-opt:not(.dis):hover{border-color:var(--p);background:#EEF0FF;}
.q-opt.ok{background:#D1FAE5;border-color:var(--ok);color:#065F46;animation:pop .3s ease;}
.q-opt.err{background:#FEE2E2;border-color:var(--err);color:#991B1B;}
.q-opt.dis{pointer-events:none;}
.q-fb{border-radius:12px;padding:12px;font-weight:700;font-size:14px;text-align:center;display:none;margin-top:10px;line-height:1.4;}
.q-fb.on{display:block;animation:pop .25s ease;}
.q-fb.ok{background:#D1FAE5;color:#065F46;}
.q-fb.err{background:#FEE2E2;color:#991B1B;}
.q-next{background:linear-gradient(135deg,var(--p),var(--s));color:#fff;border:none;border-radius:13px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;width:100%;margin-top:10px;display:none;transition:opacity .15s;box-shadow:0 3px 12px rgba(79,70,229,.3);}
.q-next.on{display:block;animation:fadeIn .2s ease;}
.q-next:active{opacity:.85;}
.q-next.math-next{background:linear-gradient(135deg,#3B82F6,#8B5CF6);}
.q-next.fs-next{background:linear-gradient(135deg,#D97706,#DC2626);}

/* RESULTS */
.res-wrap{min-height:100vh;background:linear-gradient(160deg,var(--p) 0%,var(--s) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;color:#fff;}
.res-trophy{font-size:80px;animation:bounce .7s ease;margin-bottom:10px;}
.res-title{font-size:28px;font-weight:900;margin-bottom:5px;}
.res-sub{font-size:14px;opacity:.85;margin-bottom:20px;}
.res-score-card{background:rgba(255,255,255,.2);backdrop-filter:blur(12px);border-radius:22px;padding:22px 30px;width:100%;max-width:300px;margin-bottom:16px;}
.res-big{font-size:56px;font-weight:900;line-height:1;}
.res-lbl{font-size:13px;opacity:.75;margin-top:4px;}
.res-stars{font-size:36px;margin:10px 0 4px;letter-spacing:3px;}
.xp-pill{background:rgba(255,255,255,.2);border-radius:99px;padding:8px 20px;font-size:15px;font-weight:800;margin-bottom:20px;display:inline-block;}
.res-btns{display:flex;flex-direction:column;gap:9px;width:100%;max-width:300px;}
.res-btn{background:rgba(255,255,255,.95);color:var(--p);border:none;border-radius:13px;padding:15px;font-size:15px;font-weight:800;cursor:pointer;transition:all .12s;}
.res-btn:active{opacity:.85;transform:scale(.98);}
.res-btn.sec{background:rgba(255,255,255,.18);color:#fff;border:2px solid rgba(255,255,255,.35);}

/* TOAST */
.toast{position:fixed;top:18px;left:50%;z-index:9999;transform:translateX(-50%) translateY(-90px);background:#1F2937;color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .3s ease;max-width:88%;text-align:center;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.3);}
.toast.on{transform:translateX(-50%) translateY(0);}

/* ACHIEVEMENT POPUP */
.ach-popup{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(130px);background:#1F2937;color:#fff;border-radius:18px;padding:16px 24px;font-size:15px;font-weight:700;text-align:center;z-index:9998;transition:transform .45s cubic-bezier(.34,1.56,.64,1);box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:90%;}
.ach-popup.on{transform:translateX(-50%) translateY(0);}
.ach-popup .ach-sub{font-size:12px;opacity:.7;margin-top:3px;font-weight:400;}

/* MATH BADGE ACCENT */
.math-accent{border:2.5px solid #3B82F6;}

/* ZEIT CARD */
.zeit-card{background:var(--card);margin:8px 16px 6px;border-radius:var(--r);padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.sect-hdr{font-size:11px;font-weight:800;color:var(--txt2);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:5px;}
.zeit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.zeit-stat{background:var(--bg);border-radius:11px;padding:10px 5px;text-align:center;}
.zeit-val{font-size:16px;font-weight:900;color:var(--p);line-height:1;}
.zeit-lbl{font-size:10px;color:var(--txt2);font-weight:700;margin-top:3px;text-transform:uppercase;}

/* AMPEL CARD */
.ampel-card{background:var(--card);margin:8px 16px 6px;border-radius:var(--r);padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.07);}
.ampel-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bdr);}
.ampel-row:last-of-type{border-bottom:none;}
.ampel-light{width:13px;height:13px;border-radius:50%;flex-shrink:0;}
.l-grn{background:var(--ok);box-shadow:0 0 7px rgba(16,185,129,.55);}
.l-yel{background:var(--warn);box-shadow:0 0 7px rgba(245,158,11,.5);}
.l-red{background:var(--err);box-shadow:0 0 7px rgba(239,68,68,.45);}
.l-off{background:#D1D5DB;}
.ampel-name{font-size:13px;font-weight:700;flex:1;}
.ampel-msg{font-size:11px;color:var(--txt2);}
.ampel-next{background:#EEF0FF;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:12.5px;font-weight:600;color:var(--p);display:flex;align-items:center;gap:6px;}

/* SCHULKLASSE CARD */
.klasse-card{background:linear-gradient(135deg,#1E40AF,#4F46E5);color:#fff;margin:10px 16px 6px;border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 16px rgba(79,70,229,.3);}
.klasse-ico{font-size:34px;flex-shrink:0;}
.klasse-info{flex:1;min-width:0;}
.klasse-name{font-size:18px;font-weight:900;line-height:1.1;}
.klasse-ro{font-size:11.5px;opacity:.82;margin-top:3px;}
.klasse-next{font-size:11px;opacity:.7;margin-top:4px;font-style:italic;}
.klasse-badge{background:rgba(255,255,255,.22);border-radius:11px;padding:7px 11px;font-size:15px;font-weight:900;white-space:nowrap;flex-shrink:0;text-align:center;line-height:1.3;}
.klasse-badge small{font-size:10px;opacity:.75;display:block;font-weight:600;}

/* READINESS PILL on lesson card */
.r-pill{border-radius:99px;padding:2px 7px;font-size:10px;font-weight:700;}
.r-grn{background:#D1FAE5;color:#065F46;}
.r-yel{background:#FEF3C7;color:#92400E;}
.r-red{background:#FEE2E2;color:#991B1B;}

@media(min-width:480px){.hdr{padding:28px 24px 32px;}.hdr h1{font-size:30px;}.vc-de{font-size:36px;}}

/* ════════════════════════════════════════════════════
   ONBOARDING & ADMIN
   ════════════════════════════════════════════════════ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(5px);z-index:9000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.overlay.on{opacity:1;pointer-events:all;}
.modal{background:var(--card);border-radius:24px;padding:28px 20px;max-width:400px;width:100%;box-shadow:var(--sh-lg);animation:pop .35s ease;}
.modal h2{font-size:22px;font-weight:900;color:var(--ink);margin-bottom:4px;}
.modal p{font-size:13.5px;color:var(--ink2);margin-bottom:18px;line-height:1.5;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;}
.form-group input,.form-group input[type=date]{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);font-size:15px;font-family:inherit;transition:border-color .15s;outline:none;}
.form-group input:focus,.form-group input[type=date]:focus{border-color:var(--acc);}
.form-group input::placeholder{color:var(--ink3);}
.form-btns{display:flex;gap:10px;margin-top:22px;}
.form-btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .12s;}
.form-btn.pri{background:var(--acc);color:#fff;box-shadow:0 4px 12px rgba(94,106,210,.3);}
.form-btn.pri:active{opacity:.85;transform:scale(.97);}
.form-btn.sec{background:var(--line);color:var(--ink);}
.form-btn.sec:active{opacity:.75;}

.admin-panel{position:fixed;bottom:100px;right:16px;width:280px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh-lg);z-index:8500;display:none;}
.admin-panel.on{display:block;animation:slideUp .3s ease;}
.admin-title{font-size:12px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;}
.admin-btn{width:100%;background:var(--surface2);border:none;color:var(--ink);padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px;transition:all .12s;text-align:left;}
.admin-btn:hover{background:var(--acc-tint);color:var(--acc);}
.admin-btn:last-child{margin-bottom:0;}

/* ════════════════════════════════════════════════════
   COACH-ANIMATION (Success Reactions)
   ════════════════════════════════════════════════════ */
.coach-box{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:8000;text-align:center;pointer-events:none;}
.coach-emoji{font-size:80px;line-height:1;margin-bottom:10px;animation:coachBounce .6s ease;}
.coach-text{background:var(--card);color:var(--ink);padding:12px 20px;border-radius:16px;font-size:14px;font-weight:700;border:2px solid var(--acc);box-shadow:var(--sh-md);animation:coachSlideUp .5s ease;max-width:280px;}
.coach-text small{display:block;font-size:12px;color:var(--ink2);margin-top:2px;font-weight:400;}

@keyframes coachBounce{0%{transform:scale(0) rotateZ(-20deg);opacity:0}60%{transform:scale(1.1) rotateZ(0)}100%{transform:scale(1) rotateZ(0);opacity:1}}
@keyframes coachSlideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes coachThumbsUp{0%{transform:rotateZ(-15deg)}50%{transform:rotateZ(8deg)}100%{transform:rotateZ(-10deg)}}
@keyframes coachClap{0%{transform:scaleX(1) scaleY(1)}25%{transform:scaleX(.92) scaleY(1.08)}50%{transform:scaleX(.95) scaleY(1.05)}75%{transform:scaleX(.92) scaleY(1.08)}100%{transform:scaleX(1) scaleY(1)}}
@keyframes coachDance{0%{transform:translateY(0) rotateZ(0)}25%{transform:translateY(-12px) rotateZ(-3deg)}50%{transform:translateY(0) rotateZ(0)}75%{transform:translateY(-12px) rotateZ(3deg)}100%{transform:translateY(0) rotateZ(0)}}

.coach-emoji.thumbs-up{animation:coachBounce .6s ease,coachThumbsUp 1s ease .6s infinite!important;}
.coach-emoji.clap{animation:coachBounce .6s ease,coachClap .8s ease .6s infinite!important;}
.coach-emoji.dance{animation:coachBounce .6s ease,coachDance 1.2s ease .6s infinite!important;}

/* ════════════════════════════════════════════════════
   ARTIKEL-FARBKODIERUNG (Der/Die/Das)
   ════════════════════════════════════════════════════ */
.artikel-color-der{color:#DC2626;font-weight:700;}
.artikel-color-die{color:#2563EB;font-weight:700;}
.artikel-color-das{color:#EABD16;font-weight:700;}
.artikel-badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;margin-right:4px;}
.artikel-badge-der{background:#FEE2E2;color:#DC2626;}
.artikel-badge-die{background:#DBEAFE;color:#2563EB;}
.artikel-badge-das{background:#FEF3C7;color:#92400E;}

/* ════════════════════════════════════════════════════
   DESIGN 3.0 — Soft Modern · Hell- & Dunkelmodus
   ════════════════════════════════════════════════════ */
:root{
  --canvas:#F4F6FA;--surface:#FFFFFF;--surface2:#EDF0F6;
  --ink:#1B2534;--ink2:#5D6B7E;--ink3:#97A3B4;--line:#E5E9F1;
  --acc:#5E6AD2;--acc2:#7B6FD9;--acc-tint:#ECEEFB;
  --de1:#5E6AD2;--de2:#7B6FD9;--de-tint:#ECEEFB;
  --fs1:#C9893A;--fs2:#D9A24A;--fs-tint:#F7EFE0;
  --en1:#2E9D8E;--en2:#43B3A2;--en-tint:#E2F2EE;
  --ok:#2F9E6B;--ok-bg:#E3F4EB;--ok-ink:#1E6B49;
  --err:#D45D6C;--err-bg:#FBEAED;--err-ink:#A33848;
  --warn:#C99230;--warn-bg:#F9F0DD;--warn-ink:#8A6420;
  --info-bg:#E8F1FB;--info-ink:#33618F;
  --pop:#222B3A;--pop-ink:#F2F5FA;
  --bar:rgba(255,255,255,.9);
  --sh-sm:0 1px 2px rgba(23,32,48,.04),0 2px 6px rgba(23,32,48,.05);
  --sh-md:0 6px 18px rgba(23,32,48,.08);
  --sh-lg:0 12px 30px rgba(23,32,48,.12);
  --p:var(--acc);--pd:#4A55B8;--s:var(--acc2);
  --bg:var(--canvas);--card:var(--surface);--txt:var(--ink);--txt2:var(--ink2);--bdr:var(--line);
}
body[data-theme=dark]{
  --canvas:#0E1117;--surface:#171C26;--surface2:#232A38;
  --ink:#E9EDF4;--ink2:#9FACBE;--ink3:#69768B;--line:#262E3D;
  --acc:#8C96EC;--acc2:#A89EEF;--acc-tint:#242A40;
  --de1:#8C96EC;--de2:#A89EEF;--de-tint:#242A40;
  --fs1:#DFA659;--fs2:#E8B86F;--fs-tint:#2A2316;
  --en1:#4BBBA9;--en2:#62CCBB;--en-tint:#152823;
  --ok:#4DBE8C;--ok-bg:#172A21;--ok-ink:#7BD8AE;
  --err:#E37687;--err-bg:#2C1B20;--err-ink:#F0A2AE;
  --warn:#E0B25C;--warn-bg:#2B2415;--warn-ink:#EBC988;
  --info-bg:#1B2735;--info-ink:#8FB4DC;
  --pop:#2B3447;--pop-ink:#F2F5FA;
  --bar:rgba(17,21,29,.9);
  --sh-sm:0 1px 2px rgba(0,0,0,.3),0 2px 8px rgba(0,0,0,.25);
  --sh-md:0 8px 22px rgba(0,0,0,.4);
  --sh-lg:0 14px 34px rgba(0,0,0,.5);
  --pd:#7A84DD;
}
/* Branchen-Kurs „Meserie" — Stahlblau */
body{--bf1:#4A7BAE;--bf2:#5E93C5;--bf-tint:#E4EEF7;}
body[data-theme=dark]{--bf1:#6FA3D8;--bf2:#8AB6E4;--bf-tint:#16222E;}
/* Kurs-Akzent folgt dem aktiven Tab (gilt auch in Lektion/Quiz) */
body[data-tab=fs]{--acc:var(--fs1);--acc2:var(--fs2);--acc-tint:var(--fs-tint);}
body[data-tab=beruf]{--acc:var(--bf1);--acc2:var(--bf2);--acc-tint:var(--bf-tint);}
body[data-tab=en]{--acc:var(--en1);--acc2:var(--en2);--acc-tint:var(--en-tint);}
body[data-tab=selectarii]{--acc:#64748B;--acc2:#7C8BA1;--acc-tint:var(--surface2);}
body[data-theme=dark][data-tab=selectarii]{--acc:#93A2B7;--acc2:#A9B6C9;}

html{background:var(--canvas);}
/* Alias-Variablen HIER auf body auflösen — erst hier gelten Theme- & Tab-Attribute */
body{background:var(--canvas);color:var(--ink);color-scheme:light;transition:background-color .25s ease;
  --p:var(--acc);--s:var(--acc2);--bg:var(--canvas);--card:var(--surface);--txt:var(--ink);--txt2:var(--ink2);--bdr:var(--line);}
body[data-theme=dark]{color-scheme:dark;}
.mw{max-width:480px;}

/* — Tab bar — */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:100;
  display:none;grid-template-columns:repeat(5,1fr);gap:2px;
  background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));}
body.tabs-on .tabbar{display:grid;}
body.tabs-on #app{padding-bottom:86px;}
.tab-btn{border:none;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 2px;border-radius:12px;cursor:pointer;color:var(--ink3);transition:all .15s;}
.tab-btn .tab-ico{font-size:21px;line-height:1;filter:grayscale(.85) opacity(.75);transition:filter .15s;}
.tab-btn .tab-lbl{font-size:10px;font-weight:700;letter-spacing:.1px;}
.tab-btn.active{color:var(--acc);background:var(--acc-tint);}
.tab-btn.active .tab-ico{filter:none;}
.tab-btn:active{transform:scale(.94);}

/* — Header: sanfte Tönung statt Knallfarben — */
.hdr{background:linear-gradient(170deg,var(--acc-tint) 0%,var(--canvas) 96%);color:var(--ink);padding:24px 20px 18px;text-align:left;}
.hdr::after{display:none;}
.hdr.hdr-fs{background:linear-gradient(170deg,var(--fs-tint) 0%,var(--canvas) 96%);}
.hdr.hdr-en{background:linear-gradient(170deg,var(--en-tint) 0%,var(--canvas) 96%);}
.hdr.hdr-bf{background:linear-gradient(170deg,var(--bf-tint) 0%,var(--canvas) 96%);}
.hdr.hdr-stats{background:linear-gradient(170deg,var(--surface2) 0%,var(--canvas) 96%);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:12px;}
.hdr-eyebrow{font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--acc);opacity:1;margin-bottom:3px;}
.hdr-stats .hdr-eyebrow{color:var(--ink2);}
.hdr h1{font-size:27px;font-weight:900;letter-spacing:-.6px;line-height:1.05;color:var(--ink);}
.hdr p{font-size:12.5px;color:var(--ink2);opacity:1;margin:5px 0 0;}
.stats-row{justify-content:flex-start;margin-top:12px;}
.pill{background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-size:12px;padding:5px 12px;box-shadow:var(--sh-sm);}
.theme-btn{cursor:pointer;font-size:14px;line-height:1;}
.theme-btn:active{transform:scale(.93);}

/* — Progress ring — */
.ring-wrap{position:relative;width:64px;height:64px;flex-shrink:0;}
.ring-wrap svg{transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--line);stroke-width:6;}
.ring-fg{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .7s ease;}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:var(--ink);}

/* — Cards — */
.prog-box,.zeit-card,.ampel-card,.lcard{background:var(--surface);box-shadow:var(--sh-sm);border:1px solid var(--line);}
.lcard{border-radius:18px;padding:13px 14px;border-left-width:1px;margin-bottom:8px;}
.lcard::before{width:0;}
.lcard.done{border-color:transparent;background:var(--ok-bg);}
.lcard.cur{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-tint),var(--sh-sm);}
.lcard.locked{opacity:.45;}
.l-ico{border-radius:12px;font-size:26px;width:46px;height:46px;background:var(--surface2);}
.l-title{font-size:14.5px;letter-spacing:-.2px;color:var(--ink);}
.l-sub{font-size:11.5px;color:var(--ink2);}
.badge{font-size:10px;padding:2px 7px;background:var(--surface2);color:var(--ink2);}
.badge.a1{background:var(--ok-bg);color:var(--ok-ink);}
.badge.a2{background:var(--info-bg);color:var(--info-ink);}
.badge.math{background:var(--acc-tint);color:var(--acc);}
.badge.b1{background:var(--warn-bg);color:var(--warn-ink);}
.badge.en{background:var(--en-tint);color:var(--en1);}
.badge.bf{background:var(--bf-tint);color:var(--bf1);}
.sec-title{font-size:11.5px;color:var(--ink3);letter-spacing:1.1px;}
.sect-hdr{color:var(--ink3);}
.motivate{color:var(--ink3);}
.r-pill.r-grn{background:var(--ok-bg);color:var(--ok-ink);}
.r-pill.r-yel{background:var(--warn-bg);color:var(--warn-ink);}
.r-pill.r-red{background:var(--err-bg);color:var(--err-ink);}

/* — Kurs-Infokarten — */
.course-card{background:var(--surface);margin:14px 16px 6px;border-radius:16px;padding:14px 16px;
  border:1px solid var(--line);box-shadow:var(--sh-sm);display:flex;align-items:center;gap:12px;}
.cc-ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;background:var(--surface2);}
.cc-name{font-size:14.5px;font-weight:800;letter-spacing:-.2px;color:var(--ink);}
.cc-sub{font-size:11.5px;color:var(--ink2);margin-top:2px;line-height:1.45;}
.cc-val{margin-left:auto;font-size:17px;font-weight:900;color:var(--acc);white-space:nowrap;}

/* — Schulklassen-Karte: hell & ruhig statt dunkel — */
.klasse-card{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-sm);}
.klasse-name{font-size:16.5px;color:var(--ink);}
.klasse-ro{color:var(--ink2);opacity:1;}
.klasse-next{color:var(--ink3);opacity:1;}
.klasse-badge{background:var(--acc-tint);color:var(--acc);}

/* — Ampel — */
.ampel-row{border-bottom:1px solid var(--line);}
.ampel-light{width:11px;height:11px;}
.ampel-name{font-size:12.5px;color:var(--ink);}
.ampel-msg{color:var(--ink3);}
.l-grn{background:var(--ok);box-shadow:none;}
.l-yel{background:var(--warn);box-shadow:none;}
.l-red{background:var(--err);box-shadow:none;}
.l-off{background:var(--line);box-shadow:none;}
.ampel-next{background:var(--acc-tint);color:var(--acc);}

/* — Fahrschule — */
.fs-steps{display:flex;gap:5px;margin-top:9px;}
.fs-step{flex:1;height:7px;border-radius:99px;background:var(--surface2);}
.fs-step.done{background:linear-gradient(90deg,var(--fs1),var(--fs2));}
.fs-exam-box{background:var(--warn-bg);border:1px solid var(--warn);border-radius:12px;padding:10px 13px;font-size:12px;color:var(--warn-ink);line-height:1.55;margin-top:10px;}

/* — Statistik-Tab — */
.stat-hero{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 16px 6px;}
.stat-tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 14px;box-shadow:var(--sh-sm);}
.stat-tile .st-val{font-size:23px;font-weight:900;letter-spacing:-.5px;color:var(--ink);}
.stat-tile .st-lbl{font-size:10.5px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.6px;margin-top:3px;}
.zeit-stat{background:var(--surface2);}
.zeit-val{color:var(--acc);}
.zeit-lbl{color:var(--ink3);}
.ach-grid{display:flex;flex-direction:column;gap:7px;}
.ach-row{display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 13px;box-shadow:var(--sh-sm);}
.ach-row.locked{opacity:.45;filter:grayscale(.6);}
.ach-ico{font-size:22px;width:34px;text-align:center;flex-shrink:0;}
.ach-name{font-size:13px;font-weight:700;color:var(--ink);}
.ach-desc{font-size:11px;color:var(--ink2);margin-top:1px;}
.ach-check{margin-left:auto;font-size:15px;}

/* — Lektion (Vokabel-Screen) — */
.v-hdr{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);}
.v-hdr-sub{color:var(--ink2);opacity:1;}
.back-btn{background:var(--surface2);color:var(--ink);}
.back-btn:active{background:var(--line);}
.cnt-pill{background:var(--surface2);color:var(--ink2);}
.vc-card{border:1px solid var(--line);box-shadow:var(--sh-md);}
.vc-de{color:var(--acc);}
.vc-prog{background:var(--surface2);}
.vc-prog-fill{background:var(--acc);}
.speak-btn{background:var(--acc);}
.tip-box{background:var(--warn-bg);border-left:3px solid var(--warn);color:var(--warn-ink);}
.eg-box{background:var(--info-bg);border-left:3px solid var(--info-ink);color:var(--info-ink);}
.conf-label{color:var(--ink3);}
.conf-btn{background:var(--surface);border-color:var(--line);color:var(--ink2);}
.conf-btn.active-red{background:var(--err-bg);border-color:var(--err);color:var(--err-ink);}
.conf-btn.active-yel{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink);}
.conf-btn.active-grn{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink);}
.nav-btn{background:var(--surface);border-color:var(--line);color:var(--ink);}
.nav-btn.pri{background:var(--acc);border-color:transparent;color:#fff;}
.quiz-go-btn{background:var(--ok);box-shadow:0 5px 16px rgba(47,158,107,.28);}

/* — Quiz — */
.q-hdr,.q-hdr.math-hdr,.q-hdr.fs-hdr,.q-hdr.en-hdr{background:var(--surface);color:var(--ink);border-bottom:1px solid var(--line);}
.q-prog-bar{background:var(--surface2);}
.q-prog-fill{background:var(--acc);}
.q-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-sm);}
.q-num{color:var(--ink3);}
.q-text{color:var(--ink);}
.q-text.math-q{color:var(--ink);}
.q-hint{color:var(--ink3);}
.math-hint{background:var(--surface2);color:var(--ink2);}
.q-opt{border-width:1.5px;border-radius:14px;box-shadow:var(--sh-sm);background:var(--surface);border-color:var(--line);color:var(--ink);}
.q-opt:not(.dis):hover{border-color:var(--acc);background:var(--acc-tint);}
.q-opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-ink);}
.q-opt.err{background:var(--err-bg);border-color:var(--err);color:var(--err-ink);}
.q-fb.ok{background:var(--ok-bg);color:var(--ok-ink);}
.q-fb.err{background:var(--err-bg);color:var(--err-ink);}
.q-next,.q-next.math-next,.q-next.fs-next,.q-next.en-next{background:var(--acc);box-shadow:0 4px 14px rgba(23,32,48,.18);}

/* — Ergebnis-Screen: ruhig statt Vollfarbe — */
.res-wrap{background:var(--canvas);color:var(--ink);}
.res-sub{color:var(--ink2);opacity:1;}
.res-score-card{background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-md);color:var(--ink);}
.res-lbl{color:var(--ink2);opacity:1;}
.xp-pill{background:var(--acc-tint);color:var(--acc);}
.res-btn{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:var(--sh-sm);}
.res-btns .res-btn:first-child{background:var(--acc);color:#fff;border-color:transparent;}
.res-btn.sec{background:transparent;color:var(--ink2);border:1px solid var(--line);}

/* — Weiterlern-Karte — */
.resume-card{cursor:pointer;border:1.5px solid var(--acc);transition:transform .12s;}
.resume-card:active{transform:scale(.98);}

/* — Audio-Einstellungen — */
.voice-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);}
.voice-row:last-child{border-bottom:none;}
.voice-lbl{font-size:12px;font-weight:700;color:var(--ink2);width:86px;flex-shrink:0;}
.voice-sel{flex:1;min-width:0;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:12.5px;font-family:inherit;}
.vtest{background:var(--acc-tint);color:var(--acc);border:none;border-radius:10px;width:36px;height:36px;font-size:15px;cursor:pointer;flex-shrink:0;}
.vtest:active{transform:scale(.92);}
.rate-btns{display:flex;gap:6px;flex:1;}
.rate-btn{flex:1;background:var(--surface2);color:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700;cursor:pointer;}
.rate-btn.on{background:var(--acc);border-color:transparent;color:#fff;}

/* — Toast & Popup — */
.toast{background:var(--pop);color:var(--pop-ink);}
.ach-popup{background:var(--pop);color:var(--pop-ink);}
</style>
</head>

function speak(text, lang) {
  if (!('speechSynthesis' in window)) { toast('🔇 Audio nu este disponibil'); return; }
  lang = lang || currentLang || 'de-DE';
  window.speechSynthesis.cancel();
  // Umlaut-Cleanup für bessere Aussprache
  let cleanText = text
    .replace(/Tschüss/gi, 'Tschüss')  // Standard (manche Browser sprechen „ü" besser)
    .trim();
  const u = new SpeechSynthesisUtterance(cleanText);
  u.lang = lang; u.rate = getRate(); u.pitch = 1.0;
  // Vom Anwender gewählte Stimme (Audio-Einstellungen) — sonst erste passende
  const voices = window.speechSynthesis.getVoices();
  const saved = localStorage.getItem('dl4ro_voice_'+lang.slice(0,2));
  let v = saved ? voices.find(x=>x.voiceURI===saved) : null;
  if (!v) v = voices.find(x=>x.lang.startsWith(lang.slice(0,2)));
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}

function makeVocabQuiz(lesson) {
  const vocab = lesson.vocab;
  const lang = courseOf(lesson.id)==='en' ? 'engleză' : 'germană';
  const shuffled = [...vocab].sort(()=>Math.random()-.5);
  return shuffled.slice(0, Math.min(8, vocab.length)).map(word => {
    const wrong = vocab.filter(v=>v.de!==word.de).sort(()=>Math.random()-.5).slice(0,3);
    const all = [word,...wrong].sort(()=>Math.random()-.5);
    const ci = all.findIndex(o=>o.de===word.de);
    const type = Math.random()>.5 ? 'dero' : 'rode';
    if (type==='dero') {
      return {q:word.de, hint:'Cum se traduce în română?', emoji:word.emoji,
              opts:all.map(o=>o.ro), ci, deWord:word.de, isMath:false,
              fbOk:`✓ Corect!  „${word.de}" = „${word.ro}"`,
              fbErr:`✗ Greșit!  „${word.de}" = „${word.ro}"`};
    } else {
      return {q:word.ro, hint:`Cum se spune în ${lang}?`, emoji:word.emoji,
              opts:all.map(o=>o.de), ci, deWord:word.de, isMath:false,
              fbOk:`✓ Corect!  „${word.ro}" = „${word.de}"`,
              fbErr:`✗ Greșit!  „${word.ro}" = „${word.de}"`};
    }
  });
}

function makeMathQuiz(lesson) {
  const isFs = lesson.type === 'fahrschule';
  return lesson.mathProblems.map(p => ({
    q: p.q, hint: p.hint, emoji: isFs ? '🚗' : '🧮',
    opts: p.opts, ci: p.opts.indexOf(p.a), deWord: '',
    isMath: !isFs, isFs,
    fbOk: isFs ? `✓ Richtig! ${p.a}` : `✓ Richtig! ${p.q.replace(/\n/,' ')} = ${p.a}`,
    fbErr: isFs ? `✗ Falsch! Die richtige Antwort: ${p.a}` : `✗ Falsch! Das Ergebnis ist: ${p.a}`,
  }));
}

let _sesStart=null, _sesTimer=null;

function startSes(){
  _sesStart=Date.now();
  clearInterval(_sesTimer);
  _sesTimer=setInterval(flushSes,30000);
}
function flushSes(){
  if(!_sesStart)return;
  const dur=Math.min(Math.floor((Date.now()-_sesStart)/1000),7200);
  if(dur<3)return;
  const all=loadSes();
  all.push({ts:_sesStart,dur});
  _sesStart=Date.now();
  localStorage.setItem('dl4ro_time',JSON.stringify(all.slice(-600)));
}
function endSes(){clearInterval(_sesTimer);flushSes();_sesStart=null;}
function loadSes(){try{return JSON.parse(localStorage.getItem('dl4ro_time')||'[]');}catch{return[];}}
function getZeit(){
  const all=loadSes(), d=new Date();
  const ms=(y,m,dy)=>new Date(y,m,dy).getTime();
  const todayMs=ms(d.getFullYear(),d.getMonth(),d.getDate());
  const weekMs=ms(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7));
  const monthMs=ms(d.getFullYear(),d.getMonth(),1);
  const yearMs=ms(d.getFullYear(),0,1);
  const sum=from=>all.filter(s=>s.ts>=from).reduce((a,s)=>a+s.dur,0);
  return{today:sum(todayMs),week:sum(weekMs),month:sum(monthMs),year:sum(yearMs),total:all.reduce((a,s)=>a+s.dur,0)};
}
function fmtTime(s){
  if(!s)return'—';
  if(s<60)return s+'s';
  const m=Math.floor(s/60),h=Math.floor(m/60);
  return h>0?`${h}h${m%60?' '+(m%60)+'m':''}`:m+'m';
}

function getLessonReady(id){
  const L=LESSONS.find(l=>l.id===id);
  if(!L)return'off';
  const p=getLP(id);
  if(!p.done)return'off';
  const starScore=(p.stars||0)/3;
  let grn=0,rated=0;
  L.vocab.forEach((_,i)=>{const c=getConf(id,i);if(c){rated++;if(c==='grn')grn++;}});
  const score=rated>0?starScore*.6+(grn/L.vocab.length)*.4:starScore;
  return score>=0.75?'grn':score>=0.4?'yel':'red';
}
function getGroupReady(ids){
  const done=ids.filter(id=>getLP(id).done);
  if(!done.length)return'off';
  const map={grn:1,yel:.5,red:0,off:0};
  const avg=done.reduce((a,id)=>a+(map[getLessonReady(id)]||0),0)/ids.length;
  return avg>=0.7?'grn':avg>=0.3?'yel':'red';
}
function ampelRow(r,name,msg){
  const lc={grn:'l-grn',yel:'l-yel',red:'l-red',off:'l-off'}[r]||'l-off';
  return`<div class="ampel-row"><div class="ampel-light ${lc}"></div><div class="ampel-name">${name}</div><div class="ampel-msg">${msg}</div></div>`;
}

const KLASSEN=[
  {min:0, max:0, ico:'🌱',de:'Vorschule',  ro:'Preșcolar — abia am început!'},
  {min:1, max:1, ico:'📖',de:'Klasse 1',  ro:'Clasa 1 — Grundschule'},
  {min:2, max:3, ico:'📖',de:'Klasse 2',  ro:'Clasa 2 — Grundschule'},
  {min:4, max:5, ico:'📖',de:'Klasse 3',  ro:'Clasa 3 — Grundschule'},
  {min:6, max:7, ico:'📖',de:'Klasse 4',  ro:'Clasa 4 — Grundschule'},
  {min:8, max:9, ico:'🏫',de:'Klasse 5',  ro:'Clasa 5 — Mittelschule'},
  {min:10,max:11,ico:'🏫',de:'Klasse 6',  ro:'Clasa 6 — Mittelschule'},
  {min:12,max:13,ico:'🏫',de:'Klasse 7',  ro:'Clasa 7 — Mittelschule'},
  {min:14,max:15,ico:'🎓',de:'Klasse 8',  ro:'Clasa 8 — Gymnasium'},
  {min:16,max:16,ico:'🎓',de:'Klasse 9',  ro:'Clasa 9 — Gymnasium'},
  {min:17,max:17,ico:'🏆',de:'Abitur!',   ro:'Bacalaureat — Germană finalizată!'},
];
function deDoneCnt(){return courseLessons('de').filter(l=>getLP(l.id).done).length;}
function getKlasse(){const d=deDoneCnt();return KLASSEN.find(k=>d>=k.min&&d<=k.max)||KLASSEN[KLASSEN.length-1];}
function neededForNext(){const d=deDoneCnt(),nk=KLASSEN.find(k=>k.min>d);return nk?nk.min-d:0;}

function readyMsg(r,groupDone,groupTotal){
  if(r==='off') return groupDone===0?'Neînceput':'Abia am început…';
  if(r==='grn') return'✓ Excelent! Pregătit!';
  if(r==='yel') return`În progres (${groupDone}/${groupTotal})`;
  return`Repetă — ${groupDone}/${groupTotal} lecții`;
}

function lessonCards(list){
  return list.map((L,i)=>{
    const p=getLP(L.id), prev=i>0?getLP(list[i-1].id):null;
    const isMath=L.type==='math', isFs=courseOf(L.id)==='fs', isEn=courseOf(L.id)==='en', isBf=courseOf(L.id)==='beruf';
    // Beruf: alle Module frei wählbar (keine Kette) — „aktuell" ist nur das erste offene
    const unlocked=isBf||i===0||(prev&&prev.done);
    const isCur=!p.done&&unlocked&&(!isBf||list.findIndex(l=>!getLP(l.id).done)===i);
    const cls=[p.done?'done':'',isCur?'cur':'',!unlocked?'locked':'',isMath?'math-card':isFs?'fs-card':''].filter(Boolean).join(' ');
    const starsStr=(p.stars>0?'⭐'.repeat(p.stars):'')+('☆'.repeat(3-(p.stars||0)));
    const icon=p.done?'✅':unlocked?'▶️':'🔒';
    const lvlCls=isBf?'bf':isEn?'en':isMath?'math':L.level==='A1'?'a1':L.level==='A2'?'a2':'b1';
    const lvlTxt=isMath?'🧮 Mathe':isFs?'🚗 B':isEn?'🇬🇧 '+L.level:isBf?'💼 '+L.level:L.level;
    const rdy=p.done?getLessonReady(L.id):null;
    const rdyPill=rdy?`<span class="r-pill r-${rdy}">${rdy==='grn'?'✓ Bereit':rdy==='yel'?'⟳ Üben':'↩ Wiederholen'}</span>`:'';
    return`<div class="lcard ${cls}" onclick="onLessonClick(${L.id},${unlocked})">
      <div class="l-ico" style="background:${L.color}1c">${L.emoji}</div>
      <div class="l-info">
        <div class="l-title">${i+1}. ${L.title}</div>
        <div class="l-sub">${L.titleRo}</div>
        <div class="l-meta">
          <span class="badge ${lvlCls}">${lvlTxt}</span>
          <span class="badge">${L.vocab.length} cuv.</span>
          <span class="stars">${starsStr}</span>
          ${rdyPill}
        </div>
      </div>
      <div class="l-status">${icon}</div>
    </div>`;
  }).join('');
}

function ringSvg(pct){
  const C=2*Math.PI*26, off=C*(1-pct/100);
  return`<div class="ring-wrap">
    <svg width="64" height="64" viewBox="0 0 64 64">
      <circle class="ring-bg" cx="32" cy="32" r="26"/>
      <circle class="ring-fg" cx="32" cy="32" r="26" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
    </svg>
    <div class="ring-txt">${pct}%</div>
  </div>`;
}

function courseHdr(cid){
  const c=COURSES[cid], list=courseLessons(cid);
  const done=list.filter(l=>getLP(l.id).done).length;
  const pct=Math.round(done/list.length*100);
  const streak=getStreak(), xp=totalXP();
  const profile=loadProfile();
  const greeting=profile?`${profile.name}, `:'';
  const sub=profile?`${c.sub} | De vreme ce ești din ${profile.place}!`:c.sub;
  return`<div class="hdr ${c.hdr}">
    <div class="hdr-top">
      <div>
        <div class="hdr-eyebrow">${c.eyebrow}</div>
        <h1>${greeting}${c.name}</h1>
        <p>${sub}</p>
      </div>
      ${ringSvg(pct)}
    </div>
    <div class="stats-row">
      <div class="pill">⭐ ${xp} XP</div>
      <div class="pill">📚 ${done}/${list.length}</div>
      ${streak>0?`<div class="pill">🔥 ${streak} ${streak===1?'zi':'zile'}</div>`:''}
      <button class="pill theme-btn" onclick="toggleTheme()" aria-label="Mod luminos / întunecat">${getTheme()==='dark'?'☀️':'🌙'}</button>

}

function renderLesson() {
  const L=LESSONS.find(l=>l.id===ST.lid);
  if (!L) { go('home'); return; }
  const w=L.vocab[ST.vi];
  currentWord=w.de.replace(/\s*\(.*?\)/g,'').trim(); // strip "(+)" etc for speech
  currentLang=COURSES[courseOf(L.id)].speech;
  const tot=L.vocab.length, pct=Math.round((ST.vi+1)/tot*100);
  const isLast=ST.vi===tot-1;
  const anim=ST.vocabAnim;
  const conf=getConf(ST.lid,ST.vi);
  savePos(); // Position merken — Wiedereinstieg genau hier

  const tipHtml = w.tip
    ? `<div class="tip-box">💡 ${w.tip}</div>` : '';
  const egHtml = w.eg
    ? `<div class="eg-box"><span class="eg-de">📝 ${w.eg}</span><span class="eg-ro">${w.egRo||''}</span></div>` : '';

  const confHtml = `
    <div class="conf-label">Cât de bine cunoști acest cuvânt?</div>
    <div class="conf-row">
      <button class="conf-btn ${conf==='red'?'active-red':''}" onclick="setConf(${ST.lid},${ST.vi},'red')">🔴<br>Încă nu</button>
      <button class="conf-btn ${conf==='yel'?'active-yel':''}" onclick="setConf(${ST.lid},${ST.vi},'yel')">🟡<br>Aproape</button>
      <button class="conf-btn ${conf==='grn'?'active-grn':''}" onclick="setConf(${ST.lid},${ST.vi},'grn')">🟢<br>Știu!</button>
    </div>`;

  document.getElementById('app').innerHTML = `
  <div class="screen active">
    <div class="v-hdr">
      <button class="back-btn" onclick="go('home')">‹</button>
      <div class="v-hdr-info">
        <div class="v-hdr-title">${L.emoji} ${L.title}</div>
        <div class="v-hdr-sub">${L.titleRo}</div>
      </div>
      <div class="cnt-pill">${ST.vi+1} / ${tot}</div>
    </div>
    <div class="vc-wrap">
      <div class="vc-prog"><div class="vc-prog-fill" style="width:${pct}%"></div></div>
      <div class="vc-card anim-${anim}">
        <div class="vc-emoji">${w.emoji}</div>
        <div class="vc-de">${w.de}</div>
        <div class="vc-ro">${w.ro}</div>
        <button class="speak-btn" onclick="speak(currentWord)">🔊 Pronunță</button>
        ${tipHtml}
        ${egHtml}
        ${confHtml}
      </div>
      <div class="vc-nav">
        <button class="nav-btn" onclick="vcNav(-1)" ${ST.vi===0?'disabled':''}>← Înapoi</button>
        <button class="nav-btn ${isLast?'':'pri'}" onclick="vcNav(1)">${isLast?'Gata! 🎉':'Următor →'}</button>
      </div>
      ${isLast?`<button class="quiz-go-btn" onclick="startQuiz(${L.id})">🎯 Începe Quiz-ul!</button>`:''}
    </div>
  </div>`;
}

function vcNav(d) {
  const L=LESSONS.find(l=>l.id===ST.lid);
  const ni=ST.vi+d;
  if (ni<0||ni>=L.vocab.length) return;
  ST.vocabAnim=d>0?'fwd':'bwd';
  ST.vi=ni;
  renderLesson();
}

function startQuiz(id) {
  const L=LESSONS.find(l=>l.id===id);
  ST.lid=id;
  currentLang=COURSES[courseOf(id)].speech;
  ST.quiz = L.mathProblems ? makeMathQuiz(L) : makeVocabQuiz(L);
  ST.qi=0; ST.qAnswers=[];
  go('quiz');
}

// ════════════════════════════════════════════════════
//  QUIZ
// ════════════════════════════════════════════════════
function renderQuiz() {
  const L=LESSONS.find(l=>l.id===ST.lid);
  const q=ST.quiz[ST.qi];
  const tot=ST.quiz.length, pct=Math.round(ST.qi/tot*100);
  const course=courseOf(L.id);
  const isMath=q.isMath, isFs=q.isFs||course==='fs', isEn=course==='en';
  const hdrCls=isMath?'q-hdr math-hdr':isFs?'q-hdr fs-hdr':isEn?'q-hdr en-hdr':'q-hdr';
  const textCls=(isMath||q.isFs)?'q-text math-q':'q-text';

  const opts=q.opts.map((o,i)=>
    `<button class="q-opt" id="qo${i}" onclick="answer(${i})">${o}</button>`
  ).join('');

  document.getElementById('app').innerHTML = `
  <div class="screen active">
    <div class="${hdrCls}">
      <button class="back-btn" onclick="go('home')">‹</button>
      <div class="q-prog-bar"><div class="q-prog-fill" style="width:${pct}%"></div></div>
      <div class="cnt-pill">${ST.qi+1}/${tot}</div>
    </div>
    <div class="q-wrap">
      <div class="q-card">
        <div class="q-num">${isMath?'🧮 Calcul':q.isFs?'🚗 Fahrprüfung':isFs?'🚗 Fahrschule':'📖 Vocabular'} · Întrebarea ${ST.qi+1} din ${tot}</div>
        <div class="q-emoji">${q.emoji}</div>
        <div class="${textCls}">${q.q}</div>
        ${isMath&&q.hint?`<div class="math-hint">${q.hint}</div>`:`<div class="q-hint">${q.hint}</div>`}
      </div>
      <div class="q-opts">${opts}</div>
      <div class="q-fb" id="qfb"></div>
      <button class="q-next ${isMath?'math-next':isFs?'fs-next':isEn?'en-next':''}" id="qnext" onclick="nextQ()">
        ${ST.qi+1>=tot?'📊 Vezi rezultatele':'Următoarea →'}
      </button>
    </div>
  </div>`;
}

function answer(ci) {
  const q=ST.quiz[ST.qi];
  const ok=ci===q.ci;
  document.querySelectorAll('.q-opt').forEach(b=>b.classList.add('dis'));
  document.getElementById('qo'+q.ci).classList.add('ok');
  if (!ok) document.getElementById('qo'+ci).classList.add('err');
  const fb=document.getElementById('qfb');
  fb.textContent=ok?q.fbOk:q.fbErr;
  fb.className=`q-fb on ${ok?'ok':'err'}`;
  document.getElementById('qnext').classList.add('on');
  ST.qAnswers.push(ok);
  if (ok && q.deWord) setTimeout(()=>speak(q.deWord),550);
}

function nextQ() {
  ST.qi++;
  if (ST.qi>=ST.quiz.length) go('results');
  else renderQuiz();
}

// ════════════════════════════════════════════════════
//  REZULTATE
// ════════════════════════════════════════════════════
function renderResults() {
  const correct=ST.qAnswers.filter(Boolean).length;
  const tot=ST.qAnswers.length;
  const stars=starsFor(correct,tot);
  const xp=correct*10;
  setLP(ST.lid,stars,xp);
  clearPos(); // Lektion abgeschlossen — kein Wiedereinstieg mehr nötig
  setTimeout(()=>showCoachReaction(stars),800); // Coach gratuliert nach kurzer Verzögerung
  const L=LESSONS.find(l=>l.id===ST.lid);
  const cList=courseLessons(courseOf(ST.lid));
  const nextL=cList[cList.findIndex(l=>l.id===ST.lid)+1];

  const [trophy,title,sub]=
    stars===3&&correct===tot?['🏆','Perfect!','Ai răspuns corect la toate! Felicitări!']:
    stars===3?['🏆','Aproape perfect!','Rezultat excelent! Felicitări!']:
    stars===2?['🌟','Sehr gut!','Rezultat excelent! Continuă!']:
    stars===1?['👍','Gut!','Ai trecut! Repetă pentru mai multe stele!']:
              ['💪','Noch einmal!','Revizuiește și repetă quiz-ul!'];

  const starsHtml='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  const pct=Math.round(correct/tot*100);

  document.getElementById('app').innerHTML = `
  <div class="screen active">
    <div class="res-wrap">
      <div class="res-trophy">${trophy}</div>
      <div class="res-title">${title}</div>
      <div class="res-sub">${sub}</div>
      <div class="res-score-card">
        <div class="res-big">${correct}/${tot}</div>
        <div class="res-lbl">răspunsuri corecte · ${pct}%</div>
        <div class="res-stars">${starsHtml}</div>
      </div>
      <div class="xp-pill">+${xp} XP câștigat! 🎉</div>
      <div class="res-btns">
        ${nextL&&stars>0?`
        <button class="res-btn" onclick="onLessonClick(${nextL.id},true)">
          ${nextL.emoji} ${nextL.title} →
        </button>`:''  }
        <button class="res-btn" onclick="startQuiz(${ST.lid})">🔄 Repetă quiz-ul</button>
        <button class="res-btn" onclick="ST.lid=${ST.lid};ST.vi=0;go('lesson')">📖 Revizuiește lecția</button>
        <button class="res-btn sec" onclick="go('home')">🏠 Acasă</button>
      </div>
    </div>
  </div>`;
}

// ════════════════════════════════════════════════════
//  SWIPE + KEYBOARD
// ════════════════════════════════════════════════════
let _tx=0,_ty=0;
document.addEventListener('touchstart',e=>{_tx=e.touches[0].clientX;_ty=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{
  if (ST.screen!=='lesson') return;
  const dx=_tx-e.changedTouches[0].clientX, dy=Math.abs(_ty-e.changedTouches[0].clientY);
  if (Math.abs(dx)>55&&dy<40) vcNav(dx>0?1:-1);
},{passive:true});

document.addEventListener('keydown',e=>{
  if (ST.screen==='lesson') {
    if (e.key==='ArrowRight') vcNav(1);
    else if (e.key==='ArrowLeft') vcNav(-1);
    else if (e.key===' '||e.key==='Enter') speak(currentWord||'');
  }
});

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
function init() {
  applyTheme(getTheme());
  ST.prog=loadProg();
  ST.conf=loadConf();
  ST.shownAch=loadAch();
  updateStreak();
  startSes();
  document.addEventListener('visibilitychange',()=>{ if(document.hidden)endSes(); else startSes(); });
  window.addEventListener('beforeunload',endSes);
  if ('speechSynthesis' in window) {
    speechSynthesis.getVoices();
    speechSynthesis.addEventListener('voiceschanged',()=>{
      speechSynthesis.getVoices();
      // Stimmen laden asynchron (iOS) — offene Audio-Einstellungen auffrischen
      if(ST.screen==='home'&&ST.tab==='stats')renderStats();
    });
  }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  const savedTab=localStorage.getItem('dl4ro_tab');
  const validTab=(savedTab&&COURSES[savedTab])?savedTab:'de';
  setTab(validTab);

  // Prüfe Onboarding — nur wenn kein Profil und kein Admin
  if(!loadProfile() && !isAdmin()){
    showOnboarding();
  }

  // Admin-Panel anzeigen falls aktiviert
  if(isAdmin()){
    setTimeout(showAdminPanel,500);
  }
}

init();
</script>
</body>
</html>
